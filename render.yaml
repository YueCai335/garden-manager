services:
  - type: web
    name: sun-aware-garden-planner-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PORTFOLIO_DEMO_MODE
        value: "true"
      # Season-allocation agent (ADR-0056). The run limit stays 0 until the
      # pre-release cost verification passes.
      - key: OPENAI_API_KEY
        sync: false
      - key: AGENT_OPENAI_MODEL
        value: gpt-4o-mini-2024-07-18
      - key: AGENT_PUBLIC_RUN_LIMIT
        value: "0"
