services:
  - type: web
    name: sun-aware-garden-planner-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PORTFOLIO_DEMO_MODE
        value: "true"
      # Set only after ADR-0059 is accepted and deployment is approved.
      - key: OPENAI_API_KEY
        sync: false
      # Season-allocation agent (ADR-0056). The cost check passed, but the
      # limit stays 0 because the evaluation found misleading explanations
      # (ADR-0057).
      - key: AGENT_OPENAI_MODEL
        value: gpt-4o-mini-2024-07-18
      - key: AGENT_PUBLIC_RUN_LIMIT
        value: "0"
      # Public AI Garden Note (ADR-0059). Closed until the release gates pass:
      # the limit is 3 for the C3 check and at most 58 afterwards.
      - key: CARE_NOTE_PUBLIC_ENABLED
        value: "false"
      - key: CARE_NOTE_PUBLIC_RUN_LIMIT
        value: "0"
      - key: CARE_NOTE_AI_PROVIDER
        value: openai
      - key: CARE_NOTE_OPENAI_MODEL
        value: gpt-4o-mini-2024-07-18
