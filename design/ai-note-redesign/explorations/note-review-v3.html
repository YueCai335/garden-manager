<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Garden Note review — split header, v3</title>
<!-- Mockup only: fonts from Google; the app self-hosts them. Tokens and app bar come from the Care mockup. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..600&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="../../care-redesign/mockup.css">
<style>
:root {
  --water: #195b70; --feed: #805b17; --plant: #4a6a12; --prune: #44506a; --pest: #8f3a1c;
  --water-dk: #b4e1ee; --feed-dk: #edd08f; --plant-dk: #d2e6a0; --prune-dk: #cdd4e6; --pest-dk: #f4bda6;
  --warn: #8a4b08; --warn-surface: #fff7e8;
  --glass-line: rgb(255 255 255 / 18%);
}
.proto-bar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 20px; background: #18181a; color: #fff; font-size: 13px; }
.proto-bar strong { font-weight: 600; margin-right: 4px; }
.proto-bar .sep { width: 1px; height: 18px; background: rgb(255 255 255 / 25%); margin: 0 6px; }
.proto-bar button { min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 25%); background: transparent; color: #fff; cursor: pointer; font-size: 13px; }
.proto-bar button[aria-pressed="true"] { background: #fff; color: #18181a; font-weight: 600; }
.proto-bar button.replay { border-style: dashed; }

.backdrop { position: relative; isolation: isolate; min-height: calc(100vh - 122px); padding: 40px 20px 64px; background: rgb(24 24 26 / 42%); }
.ghost-page { position: absolute; inset: 0; z-index: -1; padding: 32px 64px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-content: start; }
.ghost-page div { height: 220px; border-radius: 14px; background: #fff; }
.dialog { position: relative; isolation: isolate; max-width: 820px; margin: 0 auto; background: var(--page); border-radius: 22px; box-shadow: 0 40px 80px -40px rgb(0 0 0 / 60%); overflow: hidden; }

/* ---------- The deep green strip at the top (texture, like the app bar and Care band) ---------- */
.strip { position: absolute; inset: 0 0 auto; z-index: -1; height: var(--strip-h, 168px); background: var(--band-base) url("../../../public/landing/hero-still.webp") center 35% / cover no-repeat; }
.strip::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, rgb(9 24 15 / 78%), rgb(9 24 15 / 48%) 60%, rgb(9 24 15 / 62%)); }
.head { display: grid; gap: 6px; padding: 22px 28px 0; color: #fff; }
.head-row { display: flex; align-items: center; justify-content: space-between; }
.dlg-title { font-size: 13px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: rgb(255 255 255 / 80%); }
.close { border: 0; background: none; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; padding: 6px 2px; }
.headline { margin-top: 14px; font-family: "Bricolage Grotesque", "Instrument Sans", sans-serif; font-size: 34px; font-weight: 500; line-height: 1.05; letter-spacing: -0.03em; }
.sub { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14.5px; color: rgb(255 255 255 / 84%); }
.sub b { font-weight: 600; color: #fff; }
.sub .needs { font-weight: 600; color: #ffd59a; }

/* ---------- Note card: white card straddling the strip (variant "straddle") ---------- */
.note-wrap { padding: 22px 28px 0; }
.note { position: relative; display: grid; gap: 8px; padding: 18px 20px 20px; border-radius: 18px; background: var(--surface); box-shadow: 0 18px 40px -24px rgb(9 24 15 / 55%), 0 1px 0 rgb(0 0 0 / 3%); }
.note-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--muted); }
.note-head button { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--brand); cursor: pointer; }
.note p { font-size: 15.5px; line-height: 1.95; color: var(--ink); }
.frag { border-bottom: 2px solid var(--c); padding: 1px 0; border-radius: 2px; transition: background-color .15s, color .15s; }
.frag sup { font-size: 10px; font-weight: 700; color: var(--c); margin-left: 1px; }
.frag.planned { border-bottom: 2px dashed var(--subtle); color: var(--muted); }
.frag.on { background: rgb(31 66 48 / 10%); }
.dim .frag:not(.on) { opacity: .45; }

/* ---------- The split: one sentence branching into the gardens ---------- */
.split { position: relative; height: 84px; margin: 0 28px; }
.split svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.split path { fill: none; stroke: var(--branch); stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 220; transition: opacity .15s, stroke-width .15s; }
.split circle { fill: var(--branch); }
.split .root { fill: var(--branch); }
.animate .split path { animation: grow 1.1s ease-out .15s backwards; }
.animate .split circle.end { animation: pop .3s ease-out 1.05s backwards; }
@keyframes grow { from { stroke-dashoffset: 220; } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } }
.split path.off { opacity: .25; }
.split path.on { stroke-width: 2.5; }
@media (prefers-reduced-motion: reduce) { .animate .split path, .animate .split circle.end { animation: none; } }

.gardens-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 0 28px; }
.gchip { display: grid; align-content: start; gap: 8px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; font: inherit; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; }
.gchip:hover, .gchip.on { border-color: var(--brand); box-shadow: 0 10px 24px -16px rgb(9 24 15 / 45%); transform: translateY(-1px); }
.gchip-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gchip-name { font-size: 15px; font-weight: 600; color: var(--heading); }
.gchip-count { font-size: 13px; color: var(--muted); }
.gchip-types { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; font-weight: 600; }
.gchip-types span { display: inline-flex; align-items: center; gap: 6px; color: var(--c); }
.gchip-types i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.gchip-flag { font-size: 12.5px; font-weight: 600; color: var(--warn); }

/* ---------- Variant "glass": the split happens inside the green strip, like the landing hero ---------- */
.glass-mode .note { background: rgb(10 26 17 / 34%); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(16px) saturate(1.1); backdrop-filter: blur(16px) saturate(1.1); box-shadow: inset 0 1px 0 rgb(255 255 255 / 12%); }
.glass-mode .note-head { color: rgb(255 255 255 / 76%); }
.glass-mode .note-head button { color: #fff; }
.glass-mode .note p { color: #fff; font-family: "Bricolage Grotesque", "Instrument Sans", sans-serif; font-size: 17px; line-height: 1.85; letter-spacing: -0.005em; }
.glass-mode .frag { border-bottom-color: var(--cd); }
.glass-mode .frag sup { color: var(--cd); }
.glass-mode .frag.planned { color: rgb(255 255 255 / 58%); border-bottom-color: rgb(255 255 255 / 40%); }
.glass-mode .frag.on { background: rgb(255 255 255 / 16%); }
.glass-mode .gchip { background: rgb(255 255 255 / 9%); border-color: var(--glass-line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgb(255 255 255 / 12%); }
.glass-mode .gchip:hover, .glass-mode .gchip.on { background: rgb(255 255 255 / 16%); border-color: rgb(255 255 255 / 45%); }
.glass-mode .gchip-name { color: #fff; }
.glass-mode .gchip-count { color: rgb(255 255 255 / 75%); }
.glass-mode .gchip-types span { color: var(--cd); }
.glass-mode .gchip-types i { background: var(--cd); }
.glass-mode .gchip-flag { color: #ffd59a; }
.glass-mode .gardens-row { padding-bottom: 26px; }


/* ---------- Variant "light": hero layout, but the note and garden cards are light frosted glass ---------- */
.light-mode .note { background: rgb(255 255 255 / 90%); border: 1px solid rgb(255 255 255 / 70%); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); box-shadow: 0 18px 40px -22px rgb(0 0 0 / 55%); }
.light-mode .note p { font-family: "Bricolage Grotesque", "Instrument Sans", sans-serif; font-size: 17px; line-height: 1.85; letter-spacing: -0.005em; }
.light-mode .gchip { background: rgb(255 255 255 / 92%); border-color: rgb(255 255 255 / 70%); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 14px 30px -20px rgb(0 0 0 / 55%); }
.light-mode .gchip:hover, .light-mode .gchip.on { background: #fff; border-color: var(--brand); }
.light-mode .split circle.end { stroke: rgb(9 24 15 / 50%); stroke-width: 1; }

/* Optional: a matching textured footer, so the dialog is green at both ends. */
.green-foot .dlg-foot { position: relative; isolation: isolate; border-top: 0; color: #fff; background: var(--band-base) url("../../../public/landing/hero-still.webp") center 70% / cover no-repeat; }
.green-foot .dlg-foot::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, rgb(9 24 15 / 80%), rgb(9 24 15 / 55%) 60%, rgb(9 24 15 / 66%)); }
.green-foot .dlg-foot .text-btn { color: rgb(255 255 255 / 80%); }
.green-foot .dlg-foot .btn-secondary { background: rgb(255 255 255 / 8%); border-color: rgb(255 255 255 / 30%); color: #fff; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.green-foot .dlg-foot .button-primary { background: #fff; color: var(--band-ink); }

/* ---------- Body: garden cards and rows (same as v2) ---------- */
.dlg-body { display: grid; gap: 16px; padding: 24px 28px 28px; }
.garden { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; scroll-margin-top: 80px; transition: border-color .15s, box-shadow .15s; }
.garden.on { border-color: var(--brand); box-shadow: 0 10px 24px -18px rgb(9 24 15 / 40%); }
.garden-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 6px; }
.garden-name { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: var(--heading); }
.garden-mark { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--brand); color: #fff; }
.garden-count { font-size: 13px; color: var(--muted); }
.rec { display: grid; grid-template-columns: 22px 128px 1fr auto; align-items: start; gap: 4px 14px; margin: 0 8px; padding: 13px 12px; border-top: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: background-color .12s; }
.garden-head + .rec { border-top: 0; }
.rec:hover, .rec.on { background: var(--soft); }
.rec:last-child { margin-bottom: 8px; }
.rec input[type=checkbox] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--brand); }
.type { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--c); }
.type i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.rec-main { display: grid; gap: 6px; min-width: 0; }
.rec-title { font-size: 15px; font-weight: 500; line-height: 1.4; }
.rec-title small { color: var(--muted); font-size: 14px; font-weight: 400; }
.rec-date { font-size: 14px; color: var(--muted); white-space: nowrap; padding-top: 1px; }
.missing { justify-self: start; display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; border: 1px dashed var(--warn); background: var(--warn-surface); color: var(--warn); font-size: 13px; font-weight: 600; }
.task { justify-self: start; display: inline-flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 12px 0 6px; border-radius: 999px; background: rgb(31 66 48 / 8%); color: var(--brand); font-size: 13px; font-weight: 600; }
.task .box { width: 16px; height: 16px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 10px; }
.hint-line { font-size: 13px; color: var(--muted); }
.hint-line a { color: var(--brand); font-weight: 600; text-decoration: none; }
.skipped { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 16px 20px; border-radius: 16px; border: 1px dashed #c9c9c6; }
.skipped .label { font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.skipped q { font-size: 15px; }
.skipped small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.pill-btn { min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--brand); background: #fff; color: var(--brand); font-size: 14px; font-weight: 600; cursor: pointer; }
.dlg-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 28px; background: var(--surface); border-top: 1px solid var(--line); }
.dlg-foot .spacer { flex: 1; }
.text-btn { border: 0; background: none; font-size: 15px; font-weight: 500; color: var(--muted); cursor: pointer; padding: 8px 4px; }
.btn-secondary { display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--brand); background: #fff; color: var(--brand); font-size: 15px; font-weight: 600; cursor: pointer; }

@media (max-width: 720px) {
  .gardens-row { grid-template-columns: 1fr; } .split { display: none; }
  .rec { grid-template-columns: 22px 1fr auto; } .rec .type { grid-column: 2; } .rec-main { grid-column: 2 / -1; }
  .head, .note-wrap, .gardens-row, .dlg-body, .dlg-foot { padding-left: 18px; padding-right: 18px; }
  .ghost-page { display: none; }
}
</style>
</head>
<body>

<div class="proto-bar" role="toolbar" aria-label="Prototype variants">
  <strong>Top area</strong>
  <button data-mode="straddle" aria-pressed="true">1 · Green strip + white note card</button>
  <button data-mode="glass" aria-pressed="false">2 · Hero-style glass split</button>
  <button data-mode="light" aria-pressed="false">3 · Hero split, light cards</button>
  <span class="sep"></span><strong>Branch colour</strong>
  <button data-branch="brand" aria-pressed="true">Brand green</button>
  <button data-branch="lime" aria-pressed="false">Lime</button>
  <span class="sep"></span><strong>Footer</strong>
  <button data-foot="plain" aria-pressed="true">White</button>
  <button data-foot="green" aria-pressed="false">Green</button>
  <span class="sep"></span><button class="replay" id="replay">Replay split</button>
</div>

<header class="appbar">
  <div class="appbar-inner">
    <a class="brand" href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4.2-2.2-6.5-5.6-6.5-9.6C5.5 7.2 8.2 4.3 12 3c3.8 1.3 6.5 4.2 6.5 8.4 0 4-2.3 7.4-6.5 9.6z"/><path d="M12 21V9"/></svg>Garden Manager</a>
    <nav class="nav" aria-label="Workspace sections"><a href="#" aria-current="page">Gardens</a><a href="#">Care</a><a href="#">Next Season</a><span class="divider"></span><a href="#">Plant Doctor</a><a href="#">Plant Guide</a></nav>
    <span class="note-button">+ Note</span><span class="sync">All changes saved</span>
  </div>
</header>

<div class="backdrop">
  <div class="ghost-page" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
  <section class="dialog" id="dialog" aria-labelledby="dlg-title"></section>
</div>

<script>
const T = {
  watering:    { label: "Watered",       short: "Water",  c: "var(--water)", cd: "var(--water-dk)" },
  fertilizing: { label: "Fertilized",    short: "Feed",   c: "var(--feed)",  cd: "var(--feed-dk)" },
  planting:    { label: "Planted",       short: "Plant",  c: "var(--plant)", cd: "var(--plant-dk)" },
  pruning:     { label: "Pruned",        short: "Prune",  c: "var(--prune)", cd: "var(--prune-dk)" },
  pest:        { label: "Treated pests", short: "Pests",  c: "var(--pest)",  cd: "var(--pest-dk)" },
};
const recs = [
  { id: 1, type: "watering", garden: "Backyard", where: "Whole garden", task: "Completes “Water Backyard” · due today" },
  { id: 4, type: "pruning", garden: "Backyard", where: "Pepper", detail: "side shoots" },
  { id: 2, type: "watering", garden: "Front Yard", where: "Whole garden" },
  { id: 6, type: "planting", garden: "Front Yard", detail: "Basil × 2", missing: "Choose a planting area", hint: "Basil isn't on the Front Yard plan yet" },
  { id: 3, type: "fertilizing", garden: "Community Garden", where: "Tomato", detail: "fish emulsion · 50 ml per plant", task: "Completes “Fertilize tomatoes” · 2 days overdue" },
  { id: 5, type: "pest", garden: "Community Garden", where: "Kale", detail: "aphids · soap spray" },
];
const gardens = ["Backyard", "Front Yard", "Community Garden"];
const parts = [
  ["今天早上 ", 0], ["Backyard 和 Front Yard 都浇了水", [1, 2]], ["。", 0],
  ["Community Garden 的番茄施了鱼乳肥，每棵 50ml", [3]], ["。顺手", 0], ["把 Backyard 辣椒的侧枝剪了", [4]],
  ["，发现", 0], ["羽衣甘蓝上有蚜虫，用肥皂水喷了一遍", [5]], ["。下午", 0], ["在 Front Yard 种了 2 棵罗勒", [6]], ["。", 0],
  ["明天打算给辣椒修剪一下", "planned"], ["。", 0],
];
let mode = "light", branch = "lime", foot = "green";
const byId = id => recs.find(r => r.id === id);
const leaf = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4.2-2.2-6.5-5.6-6.5-9.6C5.5 7.2 8.2 4.3 12 3c3.8 1.3 6.5 4.2 6.5 8.4 0 4-2.3 7.4-6.5 9.6z"/><path d="M12 21V9"/></svg>`;

const noteP = () => parts.map(([t, ids]) => {
  if (!ids) return t;
  if (ids === "planned") return `<span class="frag planned">${t}</span>`;
  const r = byId(ids[0]);
  return `<span class="frag" data-ids="${ids.join(",")}" style="--c:${T[r.type].c};--cd:${T[r.type].cd}">${t}<sup>${ids.join("·")}</sup></span>`;
}).join("");

function chip(g) {
  const rs = recs.filter(r => r.garden === g);
  const needs = rs.some(r => r.missing);
  return `<button class="gchip" data-garden="${g}"><span class="gchip-top"><span class="gchip-name">${g}</span><span class="gchip-count">${rs.length}</span></span>
    <span class="gchip-types">${rs.map(r => `<span style="--c:${T[r.type].c};--cd:${T[r.type].cd}"><i></i>${T[r.type].short}</span>`).join("")}</span>
    ${needs ? `<span class="gchip-flag">1 needs input</span>` : ""}</button>`;
}

function recHTML(r) {
  const t = T[r.type];
  return `<div class="rec" data-id="${r.id}"><input type="checkbox" checked aria-label="Include record ${r.id}">
    <span class="type" style="--c:${t.c}"><i></i>${t.label}</span>
    <div class="rec-main"><div class="rec-title">${r.where ? r.where : ""}${r.detail ? `${r.where ? " " : ""}<small>${r.where ? "· " : ""}${r.detail}</small>` : ""}</div>
      ${r.missing ? `<span class="missing">${r.missing}</span>` : ""}${r.task ? `<span class="task"><span class="box">✓</span>${r.task}</span>` : ""}${r.hint ? `<div class="hint-line">${r.hint} · <a href="#">Add on plan →</a></div>` : ""}</div>
    <span class="rec-date">Today</span></div>`;
}

function render() {
  const dark = mode !== "straddle";
  const branchColour = branch === "lime" ? (dark ? "#d6ff5c" : "#7fa21a") : (dark ? "rgb(255 255 255 / 70%)" : "var(--brand)");
  dialog.className = `dialog ${mode === "glass" ? "glass-mode" : mode === "light" ? "light-mode" : ""} ${foot === "green" ? "green-foot" : ""} animate`;
  dialog.style.setProperty("--branch", branchColour);
  dialog.innerHTML = `<div class="strip"></div>
    <div class="head"><div class="head-row"><span class="dlg-title" id="dlg-title">Garden Note</span><button class="close">Close</button></div>
      <h3 class="headline">6 records across 3 gardens</h3><div class="sub"><span><b>Completes 2 tasks</b></span><span class="needs">1 needs your input</span></div></div>
    <div class="note-wrap"><div class="note" id="note"><div class="note-head">Your note <button>Edit and redo</button></div><p>${noteP()}</p></div></div>
    <div class="split"><svg id="split-svg" aria-hidden="true"></svg></div>
    <div class="gardens-row">${gardens.map(chip).join("")}</div>
    <div class="dlg-body">${gardens.map(g => { const rs = recs.filter(r => r.garden === g); return `<div class="garden" id="g-${g.replace(/ /g, "-")}" data-garden="${g}"><div class="garden-head"><span class="garden-name"><span class="garden-mark">${leaf}</span>${g}</span><span class="garden-count">${rs.length} records</span></div>${rs.map(recHTML).join("")}</div>`; }).join("")}
      <div class="skipped"><div><div class="label">Not recorded</div><q>明天打算给辣椒修剪一下</q><small>Planned, so nothing was recorded.</small></div><button class="pill-btn">Add as a task for Nov 20</button></div></div>
    <div class="dlg-foot"><button class="text-btn">Discard note</button><span class="spacer"></span><button class="btn-secondary">Add record</button><button class="button-primary">Save 6 records</button></div>`;
  layout();
  wire();
}

function layout() {
  const split = dialog.querySelector(".split"), svg = document.getElementById("split-svg");
  const box = split.getBoundingClientRect();
  const chips = [...dialog.querySelectorAll(".gchip")].map(c => { const r = c.getBoundingClientRect(); return r.left + r.width / 2 - box.left; });
  const w = box.width, h = box.height, root = w / 2;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.innerHTML = chips.map((x, i) => `<path data-garden="${gardens[i]}" d="M${root} 2 C${root} ${h * 0.55} ${x} ${h * 0.35} ${x} ${h - 1}" />`).join("") +
    `<circle class="root" cx="${root}" cy="3" r="3.2" />` + chips.map(x => `<circle class="end" cx="${x}" cy="${h - 1}" r="3.4" />`).join("");
  const note = document.getElementById("note"), d = dialog.getBoundingClientRect();
  const row = dialog.querySelector(".gardens-row").getBoundingClientRect(), chipEl = dialog.querySelector(".gchip").getBoundingClientRect();
  const stripH = mode === "glass" ? row.bottom - d.top : mode === "light" ? chipEl.top - d.top + chipEl.height * 0.5 : note.getBoundingClientRect().top - d.top + note.offsetHeight * 0.45;
  dialog.style.setProperty("--strip-h", `${stripH}px`);
}

function highlight({ ids = [], garden = null }) {
  const gardenIds = garden ? recs.filter(r => r.garden === garden).map(r => r.id) : [];
  const all = [...ids, ...gardenIds];
  const gs = new Set([garden, ...ids.map(i => byId(i).garden)].filter(Boolean));
  dialog.querySelector(".note p").parentElement.classList.toggle("dim", all.length > 0);
  dialog.querySelectorAll(".frag[data-ids]").forEach(f => f.classList.toggle("on", f.dataset.ids.split(",").some(i => all.includes(+i))));
  dialog.querySelectorAll(".rec").forEach(r => r.classList.toggle("on", all.includes(+r.dataset.id)));
  dialog.querySelectorAll(".gchip, .garden").forEach(c => c.classList.toggle("on", gs.has(c.dataset.garden)));
  dialog.querySelectorAll(".split path").forEach(p => { p.classList.toggle("on", gs.has(p.dataset.garden)); p.classList.toggle("off", gs.size > 0 && !gs.has(p.dataset.garden)); });
}
function wire() {
  const clear = () => highlight({});
  dialog.querySelectorAll(".rec").forEach(el => { el.onmouseenter = () => highlight({ ids: [+el.dataset.id] }); el.onmouseleave = clear; });
  dialog.querySelectorAll(".frag[data-ids]").forEach(f => { f.onmouseenter = () => highlight({ ids: f.dataset.ids.split(",").map(Number) }); f.onmouseleave = clear; });
  dialog.querySelectorAll(".gchip").forEach(c => {
    c.onmouseenter = () => highlight({ garden: c.dataset.garden }); c.onmouseleave = clear;
    c.onclick = () => document.getElementById(`g-${c.dataset.garden.replace(/ /g, "-")}`).scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

const dialog = document.getElementById("dialog");
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render(); });
document.querySelectorAll("[data-branch]").forEach(b => b.onclick = () => { branch = b.dataset.branch; document.querySelectorAll("[data-branch]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render(); });
document.querySelectorAll("[data-foot]").forEach(b => b.onclick = () => { foot = b.dataset.foot; document.querySelectorAll("[data-foot]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render(); });
document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.mode === mode)));
document.querySelectorAll("[data-branch]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.branch === branch)));
document.getElementById("replay").onclick = render;
addEventListener("resize", layout);
document.fonts.ready.then(render);
render();
</script>
</body>
