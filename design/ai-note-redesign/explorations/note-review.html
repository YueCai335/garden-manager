<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Garden Note review — directions</title>
<!-- Mockup only: fonts from Google; the app self-hosts them. Tokens and app bar come from the Care mockup. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..600&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="../../care-redesign/mockup.css">
<style>
:root {
  --water: #195b70; --feed: #805b17;
  /* Proposed new care-type colours, same depth as the two existing ones. */
  --plant: #4a6a12; --prune: #44506a; --pest: #8f3a1c;
  --warn: #8a4b08; --warn-surface: #fff7e8;
}
.proto-bar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 20px; background: #18181a; color: #fff; font-size: 13px; }
.proto-bar strong { font-weight: 600; }
.proto-bar button { min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 25%); background: transparent; color: #fff; cursor: pointer; font-size: 13px; }
.proto-bar button[aria-pressed="true"] { background: #fff; color: #18181a; font-weight: 600; }
.proto-bar .hint { color: rgb(255 255 255 / 65%); }

.backdrop { position: relative; min-height: calc(100vh - 122px); padding: 40px 20px 64px; background: rgb(24 24 26 / 42%); }
.ghost-page { position: absolute; inset: 0; z-index: -1; padding: 32px 64px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-content: start; }
.ghost-page div { height: 220px; border-radius: 14px; background: #fff; }
.dialog { max-width: 820px; margin: 0 auto; background: var(--surface); border-radius: 20px; box-shadow: 0 40px 80px -40px rgb(0 0 0 / 55%); overflow: hidden; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { font-size: 19px; font-weight: 600; color: var(--heading); }
.text-btn { border: 0; background: none; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; padding: 8px 4px; }
.text-btn.muted { color: var(--muted); font-weight: 500; }
.dlg-body { padding: 24px 28px 28px; display: grid; gap: 24px; }
.dlg-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 28px; border-top: 1px solid var(--line); }
.dlg-foot .spacer { flex: 1; }
.btn-secondary { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--brand); background: #fff; color: var(--brand); font-size: 15px; font-weight: 600; cursor: pointer; }
.btn-secondary:hover { background: var(--brand); color: #fff; }

.summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.summary h3 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; color: var(--heading); }
.summary p { font-size: 14px; color: var(--muted); }
.needs { color: var(--warn); font-weight: 600; }

.source { display: grid; gap: 8px; padding: 16px 18px; border-radius: 14px; background: var(--soft); }
.source-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.source-head button { border: 0; background: none; color: var(--brand); font-weight: 600; font-size: 13px; cursor: pointer; }
.source p { font-size: 15px; line-height: 1.75; }

.type { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.type i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.type span { color: var(--c); }

/* ---------- A: grouped list ---------- */
.garden-group { display: grid; gap: 4px; }
.garden-name { font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand); padding-bottom: 4px; }
.rec { display: grid; grid-template-columns: 24px 132px 1fr auto 20px; align-items: start; gap: 4px 14px; padding: 14px 0; border-top: 1px solid var(--line); cursor: pointer; }
.garden-group .rec:first-of-type { border-top: 0; }
.rec input[type=checkbox] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--brand); }
.rec-main { display: grid; gap: 4px; min-width: 0; }
.rec-title { font-size: 15px; font-weight: 500; line-height: 1.4; }
.rec-date { font-size: 14px; color: var(--muted); white-space: nowrap; padding-top: 1px; }
.rec-chev { color: var(--subtle); padding-top: 2px; }
.missing { display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; border: 1px dashed var(--warn); background: var(--warn-surface); color: var(--warn); font-size: 13px; font-weight: 600; }
.link-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.link-line.task { color: var(--brand); font-weight: 600; }
.link-line a { color: var(--brand); font-weight: 600; text-decoration: none; }
.link-line .box { width: 15px; height: 15px; border-radius: 4px; background: var(--brand); color: #fff; display: inline-grid; place-items: center; font-size: 11px; }
.edit-panel { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 12px 0 4px; }
.edit-panel label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
.edit-panel select, .edit-panel input { min-height: 40px; border: 1px solid var(--subtle); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 14px; background: #fff; }
.skipped { display: grid; gap: 10px; padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line); }
.skipped-head { font-size: 13px; font-weight: 600; color: var(--muted); }
.skipped-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.skipped-row q { font-size: 15px; }
.skipped-row small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.pill-btn { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--brand); background: #fff; color: var(--brand); font-size: 13.5px; font-weight: 600; cursor: pointer; }

/* ---------- B: note beside records ---------- */
.split { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 28px; align-items: start; }
.note-col { position: sticky; top: 0; display: grid; gap: 10px; }
.note-col .label { font-size: 13px; font-weight: 600; color: var(--muted); }
.note-text { font-size: 16px; line-height: 2; }
.frag { border-bottom: 2px solid var(--c); padding-bottom: 1px; cursor: pointer; }
.frag sup { font-size: 10.5px; font-weight: 700; color: var(--c); margin-left: 2px; }
.frag.planned { border-bottom: 2px dashed var(--subtle); color: var(--muted); }
.frag.on, .card-rec.on { background: rgb(31 66 48 / 7%); }
.cards { display: grid; gap: 10px; }
.card-rec { display: grid; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; transition: background-color .12s; }
.card-top { display: flex; align-items: center; gap: 10px; }
.num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--c); flex: none; }
.card-top .rec-date { margin-left: auto; }
.card-where { font-size: 15px; font-weight: 500; }

/* ---------- C: one at a time ---------- */
.stepper { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
.dots { display: flex; gap: 6px; }
.dots i { width: 28px; height: 4px; border-radius: 999px; background: var(--line); }
.dots i.done { background: var(--brand); }
.dots i.cur { background: var(--c); }
.focus-card { display: grid; gap: 20px; padding: 28px; border: 1px solid var(--line); border-radius: 20px; }
.focus-card q { font-size: 17px; line-height: 1.6; color: var(--muted); }
.focus-type { font-family: "Bricolage Grotesque", "Instrument Sans", sans-serif; font-size: 34px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.05; color: var(--c); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.fact { display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--soft); }
.fact small { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.fact span { font-size: 15px; font-weight: 500; }
.fact.miss { background: var(--warn-surface); border: 1px dashed var(--warn); }
.fact.miss span { color: var(--warn); }
.focus-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }

@media (max-width: 720px) {
  .split { grid-template-columns: 1fr; } .note-col { position: static; }
  .rec { grid-template-columns: 24px 1fr auto; } .rec .type { grid-column: 2; } .rec-main { grid-column: 2 / -1; } .rec-chev { display: none; }
  .edit-panel { grid-template-columns: 1fr; }
  .dlg-head, .dlg-body, .dlg-foot { padding-left: 18px; padding-right: 18px; }
  .ghost-page { display: none; }
}
</style>
</head>
<body>

<div class="proto-bar" role="toolbar" aria-label="Prototype directions">
  <strong>Review step</strong>
  <button data-view="a" aria-pressed="true">A · Grouped list</button>
  <button data-view="b" aria-pressed="false">B · Note beside records</button>
  <button data-view="c" aria-pressed="false">C · One at a time</button>
  <span class="hint">Mockup only · click records to try</span>
</div>

<header class="appbar">
  <div class="appbar-inner">
    <a class="brand" href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4.2-2.2-6.5-5.6-6.5-9.6C5.5 7.2 8.2 4.3 12 3c3.8 1.3 6.5 4.2 6.5 8.4 0 4-2.3 7.4-6.5 9.6z"/><path d="M12 21V9"/></svg>Garden Manager</a>
    <nav class="nav" aria-label="Workspace sections"><a href="#" aria-current="page">Gardens</a><a href="#">Care</a><a href="#">Next Season</a><span class="divider"></span><a href="#">Plant Doctor</a><a href="#">Plant Guide</a></nav>
    <span class="note-button">+ Note</span><span class="sync">All changes saved</span>
  </div>
</header>

<div class="backdrop">
  <div class="ghost-page" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
  <section class="dialog" aria-labelledby="dlg-title">
    <div class="dlg-head"><h2 id="dlg-title">Garden Note</h2><button class="text-btn">Close</button></div>
    <div class="dlg-body" id="body"></div>
    <div class="dlg-foot" id="foot"></div>
  </section>
</div>

<script>
const T = {
  watering:   { label: "Watered",     c: "var(--water)" },
  fertilizing:{ label: "Fertilized",  c: "var(--feed)" },
  planting:   { label: "Planted",     c: "var(--plant)" },
  pruning:    { label: "Pruned",      c: "var(--prune)" },
  pest:       { label: "Treated pests", c: "var(--pest)" },
};
const recs = [
  { id: 1, type: "watering", garden: "Backyard", where: "Whole garden", date: "Today", src: "今天早上 Backyard 和 Front Yard 都浇了水", task: "Water Backyard · due today" },
  { id: 2, type: "watering", garden: "Front Yard", where: "Whole garden", date: "Today", src: "今天早上 Backyard 和 Front Yard 都浇了水" },
  { id: 3, type: "fertilizing", garden: "Community Garden", where: "Tomato", detail: "Fish emulsion · 50 ml per plant", date: "Today", src: "Community Garden 的番茄施了鱼乳肥，每棵 50ml" , task: "Fertilize tomatoes · overdue 2 days" },
  { id: 4, type: "pruning", garden: "Backyard", where: "Pepper", detail: "Side shoots", date: "Today", src: "把 Backyard 辣椒的侧枝剪了" },
  { id: 5, type: "pest", garden: "Community Garden", where: "Kale", detail: "Aphids · soap spray", date: "Today", src: "羽衣甘蓝上有蚜虫，用肥皂水喷了一遍" },
  { id: 6, type: "planting", garden: "Front Yard", where: null, missing: "Choose planting area", detail: "Basil × 2", date: "Today", src: "在 Front Yard 种了 2 棵罗勒", notOnPlan: "Basil isn't on the Front Yard plan yet" },
];
const planned = { src: "明天打算给辣椒修剪一下", why: "Planned, so nothing was recorded.", action: "Add as task for Nov 20" };
const noteParts = [
  ["今天早上 ", null], ["Backyard 和 Front Yard 都浇了水", [1,2]], ["。", null],
  ["Community Garden 的番茄施了鱼乳肥，每棵 50ml", [3]], ["。顺手", null], ["把 Backyard 辣椒的侧枝剪了", [4]],
  ["，发现", null], ["羽衣甘蓝上有蚜虫，用肥皂水喷了一遍", [5]], ["。下午", null], ["在 Front Yard 种了 2 棵罗勒", [6]], ["。", null],
  ["明天打算给辣椒修剪一下", "planned"], ["。", null],
];
const fullNote = noteParts.map(p => p[0]).join("");
let view = "a", open = 6, step = 0;

const typeTag = r => `<span class="type" style="--c:${T[r.type].c}"><i></i><span>${T[r.type].label}</span></span>`;
const what = r => r.where ? `${r.where}${r.detail ? ` · ${r.detail}` : ""}` : (r.detail || "");
const extras = r => `${r.missing ? `<div><span class="missing">${r.missing}</span></div>` : ""}${r.task ? `<div class="link-line task"><span class="box">✓</span>Completes task: ${r.task}</div>` : ""}${r.notOnPlan ? `<div class="link-line">${r.notOnPlan} · <a href="#">Add on plan →</a></div>` : ""}`;
const summary = () => `<div class="summary"><h3>6 records across 3 gardens</h3><p>Completes 2 tasks · <span class="needs">1 needs your input</span></p></div>`;
const skipped = () => `<div class="skipped"><div class="skipped-head">Not recorded</div><div class="skipped-row"><div><q>${planned.src}</q><small>${planned.why}</small></div><button class="pill-btn">${planned.action}</button></div></div>`;
const foot = (primary = "Save 6 records") => `<button class="text-btn muted">Discard note</button><span class="spacer"></span><button class="btn-secondary">Add record</button><button class="button-primary">${primary}</button>`;

function renderA() {
  const gardens = [...new Set(recs.map(r => r.garden))];
  body.innerHTML = `${summary()}
  <div class="source"><div class="source-head">Your note <button>Edit and redo</button></div><p>${fullNote}</p></div>
  ${gardens.map(g => `<div class="garden-group"><div class="garden-name">${g}</div>${recs.filter(r => r.garden === g).map(r => `
    <div class="rec" data-id="${r.id}"><input type="checkbox" checked aria-label="Include record ${r.id}" onclick="event.stopPropagation()">${typeTag(r)}
      <div class="rec-main"><div class="rec-title">${what(r) || "&nbsp;"}</div>${extras(r)}</div>
      <span class="rec-date">${r.date}</span><span class="rec-chev">${open === r.id ? "▴" : "▾"}</span>
      ${open === r.id ? `<div class="edit-panel" onclick="event.stopPropagation()"><label>Care type<select><option>${T[r.type].label.replace("Treated pests","Pest treatment")}</option></select></label><label>Target<select><option>${r.where || "Choose planting area"}</option></select></label><label>Date<input type="date" value="2026-11-19"></label></div>` : ""}
    </div>`).join("")}</div>`).join("")}
  ${skipped()}`;
  foot_.innerHTML = foot();
  body.querySelectorAll(".rec").forEach(el => el.onclick = () => { open = open === +el.dataset.id ? 0 : +el.dataset.id; renderA(); });
}

function renderB() {
  const note = noteParts.map(([t, ids]) => {
    if (!ids) return t;
    if (ids === "planned") return `<span class="frag planned">${t}</span>`;
    const r = recs.find(x => x.id === ids[0]);
    return `<span class="frag" data-ids="${ids.join(",")}" style="--c:${T[r.type].c}">${t}${ids.map(i => `<sup>${i}</sup>`).join("")}</span>`;
  }).join("");
  body.innerHTML = `${summary()}
  <div class="split">
    <div class="note-col"><div class="label">Your note</div><p class="note-text">${note}</p><div class="source-head"><span></span><button style="border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer">Edit and redo</button></div></div>
    <div class="cards">${recs.map(r => `<div class="card-rec" data-id="${r.id}"><div class="card-top"><span class="num" style="--c:${T[r.type].c}">${r.id}</span>${typeTag(r)}<span class="rec-date">${r.date}</span></div>
      <div class="card-where">${r.garden}${r.where ? ` · ${r.where}` : ""}</div>${r.detail ? `<div class="link-line">${r.detail}</div>` : ""}${extras(r)}</div>`).join("")}
      ${skipped()}</div>
  </div>`;
  foot_.innerHTML = foot();
  const hi = ids => { body.querySelectorAll(".frag,.card-rec").forEach(e => e.classList.remove("on")); ids.forEach(i => { body.querySelector(`.card-rec[data-id="${i}"]`)?.classList.add("on"); body.querySelectorAll(".frag[data-ids]").forEach(f => f.dataset.ids.split(",").includes(String(i)) && f.classList.add("on")); }); };
  body.querySelectorAll(".frag[data-ids]").forEach(f => f.onmouseenter = () => hi(f.dataset.ids.split(",").map(Number)));
  body.querySelectorAll(".card-rec").forEach(c => c.onmouseenter = () => hi([+c.dataset.id]));
}

function renderC() {
  if (step >= recs.length) {
    body.innerHTML = `<div class="summary"><h3>All 6 records checked</h3><p>Completes 2 tasks</p></div>${skipped()}`;
    foot_.innerHTML = `<button class="text-btn muted" id="back">Back</button><span class="spacer"></span><button class="button-primary">Save 6 records</button>`;
    document.getElementById("back").onclick = () => { step = recs.length - 1; renderC(); };
    return;
  }
  const r = recs[step];
  const facts = [["Garden", r.garden], ["Target", r.where], ["Date", r.date], ...(r.detail ? [["Details", r.detail]] : [])];
  body.innerHTML = `<div class="stepper"><div class="dots">${recs.map((x, i) => `<i class="${i < step ? "done" : i === step ? "cur" : ""}" style="--c:${T[x.type].c}"></i>`).join("")}</div>Record ${step + 1} of ${recs.length}</div>
  <div class="focus-card" style="--c:${T[r.type].c}"><q>${r.src}</q><div class="focus-type">${T[r.type].label}</div>
    <div class="facts">${facts.map(([k, v]) => `<div class="fact ${v ? "" : "miss"}"><small>${k}</small><span>${v || r.missing}</span></div>`).join("")}</div>${r.task || r.notOnPlan ? `<div>${extras({ ...r, missing: null })}</div>` : ""}</div>`;
  foot_.innerHTML = `<button class="text-btn muted" id="skip">Skip this one</button><span class="spacer"></span>${step ? `<button class="btn-secondary" id="prev">Back</button>` : ""}<button class="button-primary" id="next">Looks right · Next</button>`;
  document.getElementById("next").onclick = () => { step++; renderC(); };
  document.getElementById("skip").onclick = () => { step++; renderC(); };
  const prev = document.getElementById("prev"); if (prev) prev.onclick = () => { step--; renderC(); };
}

const body = document.getElementById("body"), foot_ = document.getElementById("foot");
const render = () => ({ a: renderA, b: renderB, c: renderC })[view]();
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
  view = b.dataset.view; step = 0;
  document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
});
render();
</script>
</body>
</html>
