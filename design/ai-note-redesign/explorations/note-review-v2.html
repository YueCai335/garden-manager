<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Garden Note review — A with note highlight, v2</title>
<!-- Mockup only: fonts from Google; the app self-hosts them. Tokens and app bar come from the Care mockup. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..600&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="../../care-redesign/mockup.css">
<style>
:root {
  --water: #195b70; --feed: #805b17; --plant: #4a6a12; --prune: #44506a; --pest: #8f3a1c;
  --water-dk: #b4e1ee; --feed-dk: #edd08f; --plant-dk: #d2e6a0; --prune-dk: #cdd4e6; --pest-dk: #f4bda6;
  --warn: #8a4b08; --warn-surface: #fff7e8;
}
.proto-bar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 20px; background: #18181a; color: #fff; font-size: 13px; }
.proto-bar strong { font-weight: 600; }
.proto-bar button { min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 25%); background: transparent; color: #fff; cursor: pointer; font-size: 13px; }
.proto-bar button[aria-pressed="true"] { background: #fff; color: #18181a; font-weight: 600; }
.proto-bar .hint { color: rgb(255 255 255 / 65%); }

.backdrop { position: relative; isolation: isolate; min-height: calc(100vh - 122px); padding: 40px 20px 64px; background: rgb(24 24 26 / 42%); }
.ghost-page { position: absolute; inset: 0; z-index: -1; padding: 32px 64px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-content: start; }
.ghost-page div { height: 220px; border-radius: 14px; background: #fff; }
.dialog { max-width: 820px; margin: 0 auto; background: var(--page); border-radius: 22px; box-shadow: 0 40px 80px -40px rgb(0 0 0 / 60%); overflow: hidden; }

/* ---------- Header: plain (variant 2 and 3) or textured band (variant 1) ---------- */
.dlg-head { position: relative; isolation: isolate; display: grid; gap: 20px; padding: 22px 28px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dlg-title { font-size: 13px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--brand); }
.close { border: 0; background: none; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; padding: 6px 2px; }
.headline { font-family: "Bricolage Grotesque", "Instrument Sans", sans-serif; font-size: 34px; font-weight: 500; line-height: 1.05; letter-spacing: -0.03em; color: var(--heading); }
.sub { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 14.5px; color: var(--muted); }
.sub b { font-weight: 600; color: var(--brand); }
.sub .needs { font-weight: 600; color: var(--warn); }

.note { display: grid; gap: 8px; padding: 16px 18px; border-radius: 14px; background: var(--soft); }
.note-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--muted); }
.note-head button { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--brand); cursor: pointer; }
.note p { font-size: 15.5px; line-height: 1.95; }
.frag { border-bottom: 2px solid var(--c); padding: 1px 0; border-radius: 2px; cursor: default; transition: background-color .12s; }
.frag sup { font-size: 10px; font-weight: 700; color: var(--c); margin-left: 1px; }
.frag.planned { border-bottom: 2px dashed var(--subtle); color: var(--muted); }
.frag.on { background: rgb(31 66 48 / 10%); }

/* Variant 1: the header is a dark textured band, like the Care Today band. */
.v1 .dlg-head { color: #fff; border-bottom: 0; background: var(--band-base) url("../../../public/landing/hero-still.webp") center 35% / cover no-repeat; }
.v1 .dlg-head::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, rgb(9 24 15 / 80%), rgb(9 24 15 / 52%) 60%, rgb(9 24 15 / 64%)); }
.v1 .dlg-title, .v1 .close, .v1 .headline { color: #fff; }
.v1 .sub { color: rgb(255 255 255 / 84%); }
.v1 .sub b { color: #fff; }
.v1 .sub .needs { color: #ffd59a; }
.v1 .note { background: rgb(10 26 17 / 36%); border: 1px solid rgb(255 255 255 / 16%); -webkit-backdrop-filter: blur(14px) saturate(1.1); backdrop-filter: blur(14px) saturate(1.1); box-shadow: inset 0 1px 0 rgb(255 255 255 / 12%); }
.v1 .note-head { color: rgb(255 255 255 / 76%); }
.v1 .note-head button { color: #fff; }
.v1 .note p { color: #fff; }
.v1 .frag { border-bottom-color: var(--cd); }
.v1 .frag sup { color: var(--cd); }
.v1 .frag.planned { color: rgb(255 255 255 / 60%); border-bottom-color: rgb(255 255 255 / 40%); }
.v1 .frag.on { background: rgb(255 255 255 / 16%); }

/* Variant 2: plain header; the summary and note sit in a dark band card inside the body. */
.summary-band { position: relative; isolation: isolate; overflow: hidden; display: grid; gap: 18px; padding: 24px; border-radius: 18px; color: #fff; background: var(--band-base) url("../../../public/landing/hero-still.webp") center 35% / cover no-repeat; }
.summary-band::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, rgb(9 24 15 / 80%), rgb(9 24 15 / 52%) 60%, rgb(9 24 15 / 64%)); }

/* ---------- Body: soft page colour, white garden cards ---------- */
.dlg-body { display: grid; gap: 16px; padding: 24px 28px 28px; }
.garden { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.garden-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 6px; }
.garden-name { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: var(--heading); }
.garden-mark { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--brand); color: #fff; }
.garden-count { font-size: 13px; color: var(--muted); }
.rec { display: grid; grid-template-columns: 22px 128px 1fr auto 16px; align-items: start; gap: 4px 14px; margin: 0 8px; padding: 13px 12px; border-top: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: background-color .12s; }
.garden-head + .rec { border-top: 0; }
.rec:hover, .rec.on { background: var(--soft); }
.rec.on + .rec, .rec:hover + .rec { border-top-color: transparent; }
.rec:last-child { margin-bottom: 8px; }
.rec input[type=checkbox] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--brand); }
.type { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--c); }
.type i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.rec-main { display: grid; gap: 6px; min-width: 0; }
.rec-title { font-size: 15px; font-weight: 500; line-height: 1.4; }
.rec-title small { color: var(--muted); font-size: 14px; font-weight: 400; }
.rec-date { font-size: 14px; color: var(--muted); white-space: nowrap; padding-top: 1px; }
.rec-chev { color: var(--subtle); font-size: 12px; padding-top: 3px; }
.missing { justify-self: start; display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; border: 1px dashed var(--warn); background: var(--warn-surface); color: var(--warn); font-size: 13px; font-weight: 600; }
.task { justify-self: start; display: inline-flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 12px 0 6px; border-radius: 999px; background: rgb(31 66 48 / 8%); color: var(--brand); font-size: 13px; font-weight: 600; }
.task .box { width: 16px; height: 16px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 10px; }
.hint-line { font-size: 13px; color: var(--muted); }
.hint-line a { color: var(--brand); font-weight: 600; text-decoration: none; }
.edit-panel { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 10px 0 2px; }
.edit-panel label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
.edit-panel select, .edit-panel input { min-height: 40px; border: 1px solid var(--subtle); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 14px; background: #fff; }

.skipped { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 16px 20px; border-radius: 16px; border: 1px dashed #c9c9c6; }
.skipped .label { font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.skipped q { font-size: 15px; }
.skipped small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.pill-btn { min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--brand); background: #fff; color: var(--brand); font-size: 14px; font-weight: 600; cursor: pointer; }
.pill-btn:hover { background: var(--brand); color: #fff; }

.dlg-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 28px; background: var(--surface); border-top: 1px solid var(--line); }
.dlg-foot .spacer { flex: 1; }
.text-btn { border: 0; background: none; font-size: 15px; font-weight: 500; color: var(--muted); cursor: pointer; padding: 8px 4px; }
.btn-secondary { display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--brand); background: #fff; color: var(--brand); font-size: 15px; font-weight: 600; cursor: pointer; }
.btn-secondary:hover { background: var(--brand); color: #fff; }
.save-sub { font-size: 13px; color: var(--muted); }

/* Variant 3: light. Plain header, garden cards carry a thin brand stripe. */
.v3 .garden { border-top: 3px solid var(--brand); }
.v3 .garden-mark { display: none; }

@media (max-width: 720px) {
  .rec { grid-template-columns: 22px 1fr auto; } .rec .type { grid-column: 2; } .rec-main { grid-column: 2 / -1; } .rec-chev { display: none; }
  .edit-panel { grid-template-columns: 1fr; grid-column: 1 / -1; }
  .dlg-head, .dlg-body, .dlg-foot { padding-left: 18px; padding-right: 18px; }
  .headline { font-size: 28px; }
  .ghost-page { display: none; }
}
</style>
</head>
<body>

<div class="proto-bar" role="toolbar" aria-label="Prototype variants">
  <strong>A + note highlight · depth</strong>
  <button data-v="v1" aria-pressed="true">1 · Dark header band</button>
  <button data-v="v2" aria-pressed="false">2 · Dark summary card</button>
  <button data-v="v3" aria-pressed="false">3 · Light, brand stripes</button>
  <span class="hint">Hover a record or a sentence · click a record to edit</span>
</div>

<header class="appbar">
  <div class="appbar-inner">
    <a class="brand" href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4.2-2.2-6.5-5.6-6.5-9.6C5.5 7.2 8.2 4.3 12 3c3.8 1.3 6.5 4.2 6.5 8.4 0 4-2.3 7.4-6.5 9.6z"/><path d="M12 21V9"/></svg>Garden Manager</a>
    <nav class="nav" aria-label="Workspace sections"><a href="#" aria-current="page">Gardens</a><a href="#">Care</a><a href="#">Next Season</a><span class="divider"></span><a href="#">Plant Doctor</a><a href="#">Plant Guide</a></nav>
    <span class="note-button">+ Note</span><span class="sync">All changes saved</span>
  </div>
</header>

<div class="backdrop">
  <div class="ghost-page" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
  <section class="dialog v1" id="dialog" aria-labelledby="dlg-title"></section>
</div>

<script>
const T = {
  watering:    { label: "Watered",       c: "var(--water)", cd: "var(--water-dk)", edit: "Watering" },
  fertilizing: { label: "Fertilized",    c: "var(--feed)",  cd: "var(--feed-dk)",  edit: "Fertilizing" },
  planting:    { label: "Planted",       c: "var(--plant)", cd: "var(--plant-dk)", edit: "Planting" },
  pruning:     { label: "Pruned",        c: "var(--prune)", cd: "var(--prune-dk)", edit: "Pruning" },
  pest:        { label: "Treated pests", c: "var(--pest)",  cd: "var(--pest-dk)",  edit: "Pest treatment" },
};
const recs = [
  { id: 1, type: "watering", garden: "Backyard", where: "Whole garden", task: "Completes “Water Backyard” · due today" },
  { id: 4, type: "pruning", garden: "Backyard", where: "Pepper", detail: "side shoots" },
  { id: 2, type: "watering", garden: "Front Yard", where: "Whole garden" },
  { id: 6, type: "planting", garden: "Front Yard", detail: "Basil × 2", missing: "Choose a planting area", hint: "Basil isn't on the Front Yard plan yet" },
  { id: 3, type: "fertilizing", garden: "Community Garden", where: "Tomato", detail: "fish emulsion · 50 ml per plant", task: "Completes “Fertilize tomatoes” · 2 days overdue" },
  { id: 5, type: "pest", garden: "Community Garden", where: "Kale", detail: "aphids · soap spray" },
];
const parts = [
  ["今天早上 ", 0], ["Backyard 和 Front Yard 都浇了水", [1, 2]], ["。", 0],
  ["Community Garden 的番茄施了鱼乳肥，每棵 50ml", [3]], ["。顺手", 0], ["把 Backyard 辣椒的侧枝剪了", [4]],
  ["，发现", 0], ["羽衣甘蓝上有蚜虫，用肥皂水喷了一遍", [5]], ["。下午", 0], ["在 Front Yard 种了 2 棵罗勒", [6]], ["。", 0],
  ["明天打算给辣椒修剪一下", "planned"], ["。", 0],
];
let variant = "v1", open = 0;
const byId = id => recs.find(r => r.id === id);
const leaf = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4.2-2.2-6.5-5.6-6.5-9.6C5.5 7.2 8.2 4.3 12 3c3.8 1.3 6.5 4.2 6.5 8.4 0 4-2.3 7.4-6.5 9.6z"/><path d="M12 21V9"/></svg>`;

const noteHTML = () => `<div class="note"><div class="note-head">Your note <button>Edit and redo</button></div><p>${parts.map(([t, ids]) => {
  if (!ids) return t;
  if (ids === "planned") return `<span class="frag planned">${t}</span>`;
  const r = byId(ids[0]);
  return `<span class="frag" data-ids="${ids.join(",")}" style="--c:${T[r.type].c};--cd:${T[r.type].cd}">${t}<sup>${ids.join("·")}</sup></span>`;
}).join("")}</p></div>`;
const summaryHTML = () => `<div><h3 class="headline">6 records across 3 gardens</h3><div class="sub"><span><b>Completes 2 tasks</b></span><span class="needs">1 needs your input</span></div></div>`;

function recHTML(r) {
  const t = T[r.type];
  return `<div class="rec" data-id="${r.id}"><input type="checkbox" checked aria-label="Include record ${r.id}" onclick="event.stopPropagation()">
    <span class="type" style="--c:${t.c}"><i></i>${t.label}</span>
    <div class="rec-main"><div class="rec-title">${r.where ? r.where : ""}${r.detail ? `${r.where ? " " : ""}<small>${r.where ? "· " : ""}${r.detail}</small>` : ""}</div>
      ${r.missing ? `<span class="missing">${r.missing}</span>` : ""}${r.task ? `<span class="task"><span class="box">✓</span>${r.task}</span>` : ""}${r.hint ? `<div class="hint-line">${r.hint} · <a href="#">Add on plan →</a></div>` : ""}</div>
    <span class="rec-date">Today</span><span class="rec-chev">${open === r.id ? "▲" : "▼"}</span>
    ${open === r.id ? `<div class="edit-panel" onclick="event.stopPropagation()"><label>Care type<select><option>${t.edit}</option></select></label><label>Target<select><option>${r.where || "Choose a planting area"}</option></select></label><label>Date<input type="date" value="2026-11-19"></label></div>` : ""}
  </div>`;
}

function render() {
  const gardens = [...new Set(recs.map(r => r.garden))];
  const head = `<div class="head-row"><span class="dlg-title" id="dlg-title">Garden Note</span><button class="close">Close</button></div>`;
  const groups = gardens.map(g => { const rs = recs.filter(r => r.garden === g); return `<div class="garden"><div class="garden-head"><span class="garden-name"><span class="garden-mark">${leaf}</span>${g}</span><span class="garden-count">${rs.length} records</span></div>${rs.map(recHTML).join("")}</div>`; }).join("");
  const skipped = `<div class="skipped"><div><div class="label">Not recorded</div><q>明天打算给辣椒修剪一下</q><small>Planned, so nothing was recorded.</small></div><button class="pill-btn">Add as a task for Nov 20</button></div>`;
  const top = variant === "v1" ? `<div class="dlg-head">${head}${summaryHTML()}${noteHTML()}</div>`
    : variant === "v2" ? `<div class="dlg-head" style="padding-bottom:18px">${head}</div>`
    : `<div class="dlg-head">${head}${summaryHTML()}${noteHTML()}</div>`;
  const bodyTop = variant === "v2" ? `<div class="summary-band v1">${summaryHTML()}${noteHTML()}</div>` : "";
  dialog.className = `dialog ${variant}`;
  dialog.innerHTML = `${top}<div class="dlg-body">${bodyTop}${groups}${skipped}</div>
    <div class="dlg-foot"><button class="text-btn">Discard note</button><span class="spacer"></span><button class="btn-secondary">Add record</button><button class="button-primary">Save 6 records</button></div>`;
  wire();
}

function highlight(ids) {
  dialog.querySelectorAll(".frag, .rec").forEach(e => e.classList.remove("on"));
  ids.forEach(i => {
    dialog.querySelector(`.rec[data-id="${i}"]`)?.classList.add("on");
    dialog.querySelectorAll(".frag[data-ids]").forEach(f => f.dataset.ids.split(",").includes(String(i)) && f.classList.add("on"));
  });
}
function wire() {
  dialog.querySelectorAll(".rec").forEach(el => {
    el.onmouseenter = () => highlight([+el.dataset.id]);
    el.onmouseleave = () => highlight([]);
    el.onclick = () => { open = open === +el.dataset.id ? 0 : +el.dataset.id; render(); };
  });
  dialog.querySelectorAll(".frag[data-ids]").forEach(f => {
    f.onmouseenter = () => highlight(f.dataset.ids.split(",").map(Number));
    f.onmouseleave = () => highlight([]);
  });
}
const dialog = document.getElementById("dialog");
document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
  variant = b.dataset.v;
  document.querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
});
render();
</script>
</body>
</html>
