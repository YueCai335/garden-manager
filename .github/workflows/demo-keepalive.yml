name: Demo Keep-Alive

# Keeps the public portfolio demo ready for visitors (ADR-0074):
# - Render's free web service sleeps after about 15 idle minutes.
# - Supabase pauses a free project after about 7 days without database activity.
# Each run calls /health/db, which wakes Render and runs one read-only query.
# A failed run means the demo is down; GitHub emails the failure to the owner.

on:
  schedule:
    # Every 10 minutes. GitHub may delay or skip scheduled runs under load.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: demo-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Repository variable (Settings > Secrets and variables > Actions > Variables),
      # e.g. https://your-render-service.onrender.com. Not a secret.
      DEMO_API_URL: ${{ vars.DEMO_API_URL }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$DEMO_API_URL" ]; then
            echo "::error::Set the DEMO_API_URL repository variable to the Render API URL."
            exit 1
          fi
      - name: Wake the API and touch the database
        # A cold Render start takes about a minute, so allow retries.
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            "${DEMO_API_URL%/}/health/db"
