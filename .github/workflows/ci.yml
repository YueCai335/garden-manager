name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "backend[dev]"
      - run: python -m pytest
        working-directory: backend

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: garden_planner_test
          POSTGRES_USER: garden
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garden -d garden_planner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "backend[dev]"
      - run: python -m pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://garden@localhost:5432/garden_planner_test

  compose-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach
      - run: |
          for attempt in {1..20}; do
            curl --fail --silent http://localhost:8000/health && exit 0
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
