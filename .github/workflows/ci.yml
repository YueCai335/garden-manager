name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "backend[dev]"
      - run: python -m pytest
        working-directory: backend
      # The editable install above reads files from the source tree, so it
      # cannot catch data files missing from the built package.
      - name: Check the built package ships the demo garden
        run: |
          python -m pip wheel ./backend --no-deps --wheel-dir /tmp/dist
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install /tmp/dist/*.whl
          cd /tmp && /tmp/wheel-check/bin/python -c "from app.agent.service import load_demo_garden; assert len(load_demo_garden().areas) == 3"

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: garden_planner_test
          POSTGRES_USER: garden
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garden -d garden_planner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "backend[dev]"
      - run: python -m pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://garden@localhost:5432/garden_planner_test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -e "backend[dev]"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  compose-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach
      - run: |
          for attempt in {1..20}; do
            curl --fail --silent http://localhost:8000/health && exit 0
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
