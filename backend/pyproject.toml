[project]
name = "garden-manager-api"
version = "0.1.0"
description = "FastAPI persistence foundation for Sun-Aware Garden Planner"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  # 1.109 is the verified version with the Responses API parameters the
  # season-allocation agent sends (parallel_tool_calls, text.format, store).
  "openai>=1.109,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# The public demo reads this fixed garden instead of stored data (ADR-0056).
app = ["agent/demo_garden.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
